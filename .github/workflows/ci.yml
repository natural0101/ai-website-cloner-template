name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify generated agent files
        shell: bash
        run: |
          bash scripts/sync-agent-rules.sh
          node scripts/sync-skills.mjs
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Generated agent files are out of sync. Run both sync scripts and commit the result."
            git status --short
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check cloning and design workbench
        run: |
          npm run clone:test
          npm run design:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
