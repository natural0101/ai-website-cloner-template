services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ai-website-cloner:local-dev
    environment:
      NODE_ENV: development
    ports:
      - "127.0.0.1:${DEV_PORT:-3101}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
    name: ai-website-cloner-dev-node-modules
    labels:
      io.teamon.local.project: ai-website-cloner
  next_cache:
    name: ai-website-cloner-dev-next-cache
    labels:
      io.teamon.local.project: ai-website-cloner
